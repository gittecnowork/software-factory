# Registro de proyectos de Tecnowork
#
# Qué es: el inventario de TODO proyecto que ocupa recursos en las cuentas de Tecnowork
# (Supabase, Vercel, Railway, dominios), use la fábrica o no. Sirve para tres cosas:
#   1. Impacto: qué repos consumen cada plugin antes de publicar un cambio.
#   2. Costos: a qué proyecto/cliente se imputa cada recurso (doc 06 del Proyecto).
#   3. Huérfanos y topes: recursos sin dueño y el límite de 2 proyectos Free de Supabase.
#
# Reglas del archivo:
#   - Solo hechos estables: ids, orgs, repos, estado de ciclo de vida, fechas.
#   - NUNCA claves, contraseñas, connection strings ni tokens.
#   - El repo es PÚBLICO (desde 2026-09-17): `cliente` es un alias, nunca el nombre real de una
#     persona o comercio, ni sus datos de contacto. Sin IPs. Los ids de recursos se aceptan
#     porque sin credenciales no dan acceso; si eso cambia, el registro se muda a un repo privado.
#   - NO se copian costos ni estado en vivo (healthy, pausado por inactividad, uso):
#     se consultan por MCP o en la factura. Copiados, envejecen.
#   - NO se registran versiones de plugins: `enabledPlugins` no fija versión; cada repo
#     usa la que publica el marketplace. La versión real se lee con `claude plugin list`.
#   - Lo no comprobado lleva `verificado: false` y una nota que dice por qué (regla 3).
#   - Se edita SOLO desde la sesión de la fábrica (regla 18). La skill
#     `alta-de-proyecto-en-la-fabrica` devuelve la entrada lista en su reporte (Fase 6);
#     la skill `auditar-registro` de este repo la cruza contra los MCP.
#
# Esquema de cada entrada:
#   id:            slug estable, igual al nombre del repo cuando se puede
#   nombre:        nombre visible
#   cliente:       a quién se imputa el costo ("Tecnowork (interno)" si es propio)
#   repo:          owner/repo en GitHub
#   estado:        desarrollo | produccion | pausado | baja
#   alta:          AAAA-MM-DD (primera vez que ocupó un recurso)
#   usa_fabrica:   true | false
#   plugins:       lista de enabledPlugins del .claude/settings.json del repo (sin versión)
#   recursos:
#     supabase:    { org, ref, region }     o null
#     vercel:      { team, project, id }    o null
#     railway:     { workspace, project, id } o null
#     dominios:    [ ... ]
#   verificado:    true | false
#   verificado_el: AAAA-MM-DD
#   notas:         lo que falta confirmar, o decisiones propias del proyecto

