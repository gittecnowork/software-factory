# Etapa 1 de la revisión automática (docs/decisiones/2026-09-17-revision-automatica-de-contribuciones.md).
# Chequeos deterministas: sin IA, sin secretos. En un repo público los minutos de Actions no se cobran.
name: chequeos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chequeos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chequeos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # el chequeo del bump necesita el commit base

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Instalar el CLI de Claude Code (solo para "plugin validate", que no pide autenticación)
        run: npm install -g @anthropic-ai/claude-code

      - name: Chequeos de la fábrica
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          BASE_PUSH: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then BASE="$BASE_PR"; else BASE="$BASE_PUSH"; fi
          node .github/scripts/chequeos-fabrica.mjs --base "$BASE"
